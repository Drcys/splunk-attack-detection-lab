name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest pyyaml sigma-cli
      - name: Validate dashboards, alerts, Sigma rules and links
        run: pytest -v
      - name: Sigma syntax check
        run: sigma check sigma/
