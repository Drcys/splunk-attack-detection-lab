title: Burst of Failed Logons From a Single Source
id: 9d3e5f7a-2b4c-4d6e-9f8a-0b1c2d3e4f66
status: experimental
description: >
  Ten or more failed logons from one source address within 15 minutes. Portable
  version of Rule 1 in this lab (which correctly returned no results on the lab data).
author: Basem Zaher Al-Ammari
date: 2026-10-09
references:
  - https://attack.mitre.org/techniques/T1110/
correlation:
  type: event_count
  rules:
    - failed_logon
  group-by:
    - IpAddress
  timespan: 15m
  condition:
    gte: 10
falsepositives:
  - Misconfigured service accounts retrying stale credentials.
level: medium
