# splunk-attack-detection-lab — detections packaged as scheduled Splunk alerts
#
# Install: copy this file to
#   $SPLUNK_HOME/etc/apps/search/local/savedsearches.conf
# then restart Splunk (or run: splunk reload savedsearch).
# The alerts then appear under Settings > Searches, reports, and alerts.
#
# Thresholds are tuned to the lab data set and must be baselined before use in
# a real environment. Each alert lists its MITRE ATT&CK technique.

[LAB - T1053.005 Scheduled task created with hidden or encoded PowerShell]
description = Scheduled-task creation (4698) whose action runs PowerShell with hidden-window or encoded-command flags. ATT&CK T1053.005 + T1059.001.
search = index=main source="wineventlog.log" EventCode=4698 \
| search TaskContent="*powershell*" (TaskContent="*-enc*" OR TaskContent="*-w hidden*" OR TaskContent="*-nop*") \
| table _time, host, user, TaskName, TaskContent
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = host,TaskName

[LAB - T1071 C2 beaconing (fixed-interval outbound connections)]
description = Generalised beacon hunt: any source/destination pair with many connections at a near-constant interval (low jitter). Does not depend on a known bad domain. ATT&CK T1071 / T1041.
search = index=main source="proxy.log" \
| sort 0 _time \
| streamstats current=f last(_time) as prev_time by src_ip, dest_host \
| eval delta = _time - prev_time \
| stats count, avg(delta) as avg_interval, stdev(delta) as jitter, sum(bytes_out) as bytes_out, \
        min(_time) as first_seen, max(_time) as last_seen by src_ip, dest_host \
| where count >= 20 AND jitter < 10 \
| eval avg_interval = round(avg_interval, 1), jitter = round(jitter, 1), \
       first_seen = strftime(first_seen, "%F %T"), last_seen = strftime(last_seen, "%F %T") \
| sort - count
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = src_ip,dest_host

[LAB - T1078 Logon followed by special privilege assignment]
description = Successful logon (4624) followed within 5 seconds by special-privilege assignment (4672) for the same user. ATT&CK T1078.
search = index=main source="wineventlog.log" (EventCode=4624 OR EventCode=4672) \
| transaction user maxspan=5s startswith=(EventCode=4624) endswith=(EventCode=4672) \
| table _time, host, user, src_ip, duration
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1

[LAB - T1110 Brute force (many failed logons from one source)]
description = Threshold rule for password guessing: 10+ failed logons (4625) from one source in 15 minutes. Correctly returned no results on the lab data (documented negative finding). ATT&CK T1110.
search = index=main source="wineventlog.log" EventCode=4625 \
| bin _time span=15m \
| stats count, dc(user) as users_targeted, values(user) as users by _time, src_ip \
| where count >= 10
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
